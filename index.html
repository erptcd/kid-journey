<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Hành Trình Bé Giỏi</title>
<meta name="description" content="Game 3D học Toán lớp 2 và tiếng Anh Starters trên các chuyến tàu Việt Nam">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#22314f;--card:#ffffffee;--pri:#ff7a3d;--ok:#2bb673;--bad:#ef476f;--blue:#3a86ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#bfe6ff;font-family:'Baloo 2',system-ui,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font-family:inherit;cursor:pointer;border:none;color:inherit}
select{font-family:inherit;font-size:16px;font-weight:700;padding:6px 10px;border-radius:12px;border:2px solid #e1e8f3;background:#fff;color:var(--ink);max-width:100%}
.hidden{display:none!important}
/* MENU */
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:flex-end;padding:14px}
.menu-card{background:var(--card);backdrop-filter:blur(8px);border-radius:28px;box-shadow:0 12px 40px #0003;padding:18px 22px;width:min(640px,100%);max-height:100%;overflow:auto}
.menu-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
h1{margin:0;font-size:clamp(26px,4vw,40px);line-height:1.05;color:#ff6b2c;text-shadow:0 3px 0 #ffd6a8}
h1 small{display:block;font-size:.4em;color:var(--ink);text-shadow:none;font-weight:600;margin-top:4px}
.pills{display:flex;gap:8px}
.total{background:#fff4c2;border-radius:999px;padding:5px 14px;font-weight:800;font-size:18px;white-space:nowrap}
.step{margin-top:12px}
.step-title{font-weight:800;font-size:17px;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.step-title b{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--pri);color:#fff;font-size:16px;flex:none}
.grid{display:grid;gap:10px}.veh{grid-template-columns:repeat(4,1fr)}.subj{grid-template-columns:repeat(2,1fr)}
.opt{background:#fff;border-radius:18px;padding:10px 6px;box-shadow:0 3px 0 #d9e2f0,0 0 0 3px #e7edf7 inset;text-align:center}
.opt .em{font-size:38px;line-height:1.1;display:block}.opt .nm{font-weight:800;font-size:18px;display:block}.opt .sub{font-size:13px;opacity:.7;display:block;line-height:1.2}
.opt.sel{box-shadow:0 3px 0 #e2621f,0 0 0 4px var(--pri) inset;background:#fff3ea}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:#fff;border-radius:999px;padding:6px 14px;font-weight:700;font-size:15px;box-shadow:0 0 0 2px #e1e8f3 inset}
.chip.sel{background:var(--blue);color:#fff;box-shadow:none}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#routeLine{margin-top:6px;font-weight:700;font-size:15px;display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;background:#f3f7ff;border-radius:14px;padding:6px 10px}
#routeLine b{color:var(--pri)}
.go{background:linear-gradient(180deg,#ffb35c,#ff7a3d);color:#fff;font-size:24px;font-weight:800;padding:9px 30px;border-radius:999px;box-shadow:0 5px 0 #d4561c}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 #d4561c}
.row-end{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
/* HUD */
#hud{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:8px;padding:10px 12px;pointer-events:none}
#hud>*{pointer-events:auto}
.pill{background:var(--card);border-radius:999px;padding:6px 14px;font-weight:700;box-shadow:0 4px 14px #0002;font-size:16px;white-space:nowrap}
#hudRoute{flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;min-width:0}
#hudRoute small{opacity:.6}
#slots span{opacity:.3;font-size:18px}#slots span.on{opacity:1}
.ibtn{width:44px;height:44px;border-radius:50%;background:var(--card);font-size:21px;box-shadow:0 4px 14px #0002;flex:none}
#banner{position:fixed;top:66px;left:50%;transform:translateX(-50%);background:#22314fdd;color:#fff;padding:8px 22px;border-radius:999px;font-weight:700;font-size:19px;white-space:nowrap;transition:opacity .3s;pointer-events:none;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
#mini{position:fixed;left:12px;top:64px;background:#ffffffd9;border-radius:16px;padding:6px;box-shadow:0 4px 14px #0002;pointer-events:none}
#speedfx{position:fixed;inset:0;pointer-events:none;background:repeating-conic-gradient(from 0deg at 50% 50%,#ffffff00 0deg,#ffffff00 6deg,#ffffff55 6.5deg,#ffffff00 7deg);mask:radial-gradient(circle at 50% 50%,transparent 38%,#000 75%);-webkit-mask:radial-gradient(circle at 50% 50%,transparent 38%,#000 75%);animation:spd .25s linear infinite}
@keyframes spd{50%{transform:scale(1.04) rotate(1deg)}}
/* QUESTION PANEL */
#qp{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(880px,calc(100% - 20px));background:var(--card);backdrop-filter:blur(8px);border-radius:26px;box-shadow:0 12px 40px #0004;padding:12px 18px;display:flex;gap:16px;animation:up .35s ease-out;max-height:72vh;overflow:auto}
@keyframes up{from{transform:translate(-50%,40px);opacity:0}}
#qp.shake{animation:sh .4s}@keyframes sh{20%{transform:translate(calc(-50% - 10px))}40%{transform:translate(calc(-50% + 10px))}60%{transform:translate(calc(-50% - 6px))}80%{transform:translate(calc(-50% + 6px))}}
.qleft{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.topic{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;font-weight:700;color:#6b7891}
.topic button{background:#eaf1ff;border-radius:999px;padding:2px 12px;font-weight:700;font-size:15px;flex:none}
#qPrompt{font-size:22px;font-weight:700;line-height:1.3}
#qPrompt .big{font-size:48px;font-weight:800;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#qVisual{display:flex;justify-content:center}#qVisual svg{max-height:200px;width:auto}
.emoji-pic{font-size:96px;line-height:1.1;filter:drop-shadow(0 6px 6px #0002)}
.count-pic{font-size:40px;line-height:1.25;max-width:420px;text-align:center}
.ans{min-width:96px;height:58px;border-radius:16px;background:#fff;box-shadow:0 0 0 3px #cfd9ea inset;display:inline-grid;place-items:center;padding:0 14px;color:var(--blue);font-size:38px;font-weight:800}
.ans.blink::after{content:'';width:3px;height:34px;background:var(--blue);animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
#qAnswer{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.unit{font-size:28px;font-weight:800}
.slots{display:flex;gap:6px;flex-wrap:wrap}
.slot{width:44px;height:54px;border-radius:12px;background:#fff;box-shadow:0 0 0 3px #cfd9ea inset;display:grid;place-items:center;font-size:32px;font-weight:800;color:var(--blue)}
.slot.cur{box-shadow:0 0 0 3px var(--pri) inset}.slot.fix{color:#8a94a8;background:#f1f4f9}
.choices{display:flex;gap:10px;flex-wrap:wrap}
.choice{min-width:86px;padding:8px 16px;border-radius:16px;background:#fff;font-size:26px;font-weight:800;box-shadow:0 4px 0 #cfd9ea,0 0 0 2px #e4ebf6 inset}
.choices.pics .choice{display:flex;flex-direction:column;align-items:center;padding:6px}
.choices.pics .choice .emoji-pic{font-size:58px}.choices.pics .choice svg{width:84px;height:84px}
.choice.right{background:#d8f5e5;box-shadow:0 0 0 3px var(--ok) inset}.choice.wrong{background:#ffe3e8;box-shadow:0 0 0 3px var(--bad) inset}
.fb{min-height:28px;font-weight:700;font-size:18px}.fb.good{color:var(--ok)}.fb.bad{color:var(--bad)}.fb.hint{color:#b26b00}
.qright{display:flex;flex-direction:column;gap:8px;justify-content:center;align-items:center}
.pad{display:grid;grid-template-columns:repeat(3,60px);gap:8px}
.k{height:52px;border-radius:14px;background:#fff;font-size:27px;font-weight:800;box-shadow:0 4px 0 #cfd9ea,0 0 0 2px #e4ebf6 inset}
.k:active{transform:translateY(3px)}
.k.ok{background:var(--ok);color:#fff;box-shadow:0 4px 0 #1d8a55}.k.del{background:#ffe3e8;color:#c22d51;box-shadow:0 4px 0 #f2b8c4}
.tiles{display:flex;flex-wrap:wrap;gap:7px;max-width:320px;justify-content:center}
.tile{width:48px;height:52px;border-radius:14px;background:#fff6d6;font-size:29px;font-weight:800;box-shadow:0 4px 0 #f0d27a}.tile:disabled{opacity:.25}
.tactions{display:flex;gap:8px}.tactions .k{width:92px}
.mic{width:104px;height:104px;border-radius:50%;background:linear-gradient(180deg,#ff8a5c,#ff5d3a);font-size:50px;box-shadow:0 6px 0 #d4461c}
.mic.on{animation:pulse 1s infinite}@keyframes pulse{50%{box-shadow:0 0 0 18px #ff7a3d33,0 6px 0 #d4461c}}
.miclab{max-width:250px;text-align:center;font-weight:700}
.next{background:var(--blue);color:#fff;font-size:20px;font-weight:800;padding:6px 20px;border-radius:999px;margin-left:6px}
#bonusBar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + min(72vh, 360px));width:min(500px,80vw);height:12px;background:#ffffffaa;border-radius:6px;overflow:hidden}
#bonusBar>div{height:100%;background:linear-gradient(90deg,#ffd23f,#ff7a3d);transition:width .1s linear}
/* STAMPS */
.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:12px}
.stamps.small{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
.stamp{background:#fffdf5;padding:10px 8px;text-align:center;border-radius:6px;box-shadow:0 3px 8px #0002,0 0 0 4px #fff,0 0 0 6px #e8b04a;position:relative;border:2px dashed #e8b04a}
.stamp.off{filter:grayscale(1);opacity:.45}
.st-e{font-size:40px;line-height:1.1}.st-n{font-weight:800;font-size:16px;line-height:1.1}.st-p{font-size:12px;color:#c1121f;font-weight:700}.st-f{font-size:12px;line-height:1.2;opacity:.8}
#stampPop{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;animation:thump .5s cubic-bezier(.2,1.8,.4,1)}
#stampPop .stamp{width:200px;transform:rotate(-6deg);background:#fff}#stampPop .st-e{font-size:72px}#stampPop .st-n{font-size:24px}
.sp-t{margin-top:12px;background:#22314fdd;color:#fff;border-radius:999px;padding:6px 18px;font-weight:800;font-size:20px;display:inline-block}
@keyframes thump{from{transform:translate(-50%,-50%) scale(2.4) rotate(12deg);opacity:0}}
#passport{position:fixed;inset:0;background:#0006;display:grid;place-items:center;padding:14px;z-index:20}
.pp-card{background:#fff8e7;border-radius:24px;width:min(900px,100%);max-height:92vh;overflow:auto;padding:16px 20px;box-shadow:0 16px 50px #0005;border:6px solid #8d5524}
.pp-head{display:flex;justify-content:space-between;align-items:center}.pp-head h2{margin:0;color:#8d5524}
.pp-card h3{margin:14px 0 8px}.pp-card h3 small{color:#888}
/* FINISH */
#fin{position:fixed;inset:0;display:grid;place-items:center;background:#0004;padding:16px}
.fin-card{background:#fff;border-radius:30px;padding:22px 26px;text-align:center;width:min(560px,100%);max-height:92vh;overflow:auto;box-shadow:0 16px 50px #0005;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.fin-card h2{margin:0;font-size:40px;color:#ff6b2c}.fin-stars{font-size:32px;letter-spacing:2px;margin:6px 0}.fin-msg{font-size:19px;font-weight:700;margin-bottom:10px}
.fs-t{font-weight:800;margin:6px 0}.fin-btns{display:flex;flex-direction:column;gap:10px;align-items:center;margin-top:14px}
.ghost{background:#eef3fb;font-weight:800;font-size:18px;padding:8px 22px;border-radius:999px}
.hold{touch-action:none;-webkit-touch-callout:none}
#homeBtn{font-size:17px;opacity:.75;background:conic-gradient(#ff7a3d calc(var(--p,0)*360deg),#ffffffee 0)}
.parent{font-size:13px;font-weight:700;color:#7a869a;padding:6px 14px;border-radius:999px;background:linear-gradient(90deg,#ffd6bf calc(var(--p,0)*100%),#f1f4f9 0)}
.confetti{position:fixed;top:-20px;width:12px;height:18px;border-radius:3px;pointer-events:none;animation:fall linear forwards;z-index:50}@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
#loading{position:fixed;inset:0;display:grid;place-items:center;font-size:24px;font-weight:800;color:#fff;background:#7cc6f5}
@media (max-width:820px){#menu{justify-content:center}.veh{grid-template-columns:repeat(2,1fr)}#qp{flex-direction:column;gap:6px;padding:10px}.qright{align-items:center}#mini{display:none}#hudRoute{font-size:14px}#slots,#streak{display:none}}
@media (max-height:600px){#qPrompt .big{font-size:34px}.emoji-pic{font-size:64px}.k{height:42px;font-size:22px}.pad{grid-template-columns:repeat(3,52px)}#qVisual svg{max-height:120px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="loading">Đang chuẩn bị chuyến đi… 🚂</div>
<div id="speedfx" class="hidden"></div>

<div id="menu" class="hidden"><div class="menu-card">
  <div class="menu-head"><h1>Hành Trình Bé Giỏi<small>Trả lời đúng để đón khách lên toa, rồi cùng đi khắp Việt Nam!</small></h1>
    <div class="pills"><button class="total" id="stampCount">📖 0</button><div class="total" id="total">⭐ 0</div></div></div>
  <div class="step"><div class="step-title"><b>1</b>Chọn phương tiện</div><div class="grid veh" id="vehList"></div></div>
  <div class="step"><div class="step-title"><b>2</b>Hành trình</div>
    <div class="row"><select id="startSel"></select><div class="chips" id="dirChips"></div></div>
    <div class="row" style="margin-top:6px"><span style="font-weight:700">Số chặng:</span><div class="chips" id="legChips"></div></div>
    <div id="routeLine"></div></div>
  <div class="step"><div class="step-title"><b>3</b>Môn học</div>
    <div class="grid subj"><button class="opt" data-subj="math"><span class="em">➕➖</span><span class="nm">Toán 2</span><span class="sub">Kết nối tri thức · HK1</span></button><button class="opt" data-subj="en"><span class="em">🔤</span><span class="nm">English</span><span class="sub">Cambridge Starters</span></button></div>
    <div style="margin-top:8px;font-weight:700;font-size:15px" id="optTitle"></div><div class="chips" id="optChips" style="margin-top:4px"></div>
    <div id="enTopicWrap" class="row hidden" style="margin-top:6px"><span style="font-weight:700">Topic:</span><select id="enTopic"></select></div></div>
  <div class="step"><div class="step-title"><b>4</b><span id="slotTitle">Số toa</span></div><div class="chips" id="slotChips"></div></div>
  <div class="row-end"><span style="font-size:14px;opacity:.7">Mỗi câu đúng = 1 nhóm khách lên toa. Đủ toa thì tàu chạy!</span><button class="go" id="goBtn">Xuất phát! 🚦</button></div>
</div></div>

<div id="hud" class="hidden">
  <button class="ibtn hold" id="homeBtn" title="Phụ huynh: giữ 2 giây để về menu">🔒</button>
  <div class="pill" id="hudRoute"></div>
  <div class="pill" id="slots"></div>
  <div class="pill" id="streak" title="Đúng 3 câu liền để tăng tốc"></div>
  <div class="pill" id="starPill">⭐ 0</div>
  <button class="ibtn" id="ppBtn" title="Sổ tem">📖</button>
  <button class="ibtn" id="camBtn" title="Đổi góc máy">🎥</button>
  <button class="ibtn" id="muteBtn" title="Âm thanh">🔊</button>
</div>
<div id="mini" class="hidden"></div>
<div id="banner" class="hidden"></div>
<div id="bonusBar" class="hidden"><div></div></div>

<div id="qp" class="hidden">
  <div class="qleft">
    <div class="topic"><span id="qTopic"></span><button id="qListen">🔊</button></div>
    <div id="qPrompt"></div><div id="qVisual"></div><div id="qAnswer"></div><div class="fb" id="qFb"></div>
  </div>
  <div class="qright" id="qPad"></div>
</div>

<div id="stampPop" class="hidden"></div>
<div id="passport" class="hidden"><div class="pp-card"><div class="pp-head"><h2>📖 Sổ tem hành trình</h2><button class="ghost" id="ppClose">Đóng ✕</button></div><div id="ppBody"></div></div></div>

<div id="fin" class="hidden"><div class="fin-card">
  <h2>Về đích! 🏁</h2><div class="fin-stars" id="finStars"></div><div class="fin-msg" id="finMsg"></div><div id="finStamps"></div>
  <div class="fin-btns"><button class="go" id="againBtn">Đi tiếp ➜</button><button class="parent hold" id="menuBtn">🔒 Phụ huynh: giữ 2 giây để đổi xe / môn học</button></div>
